module_detail:
  name: Just-in-Time Disposable Tests Module (JiTTests)
  id: jit_tests
  default: "OFF"
  scale: Platoon+
  why: >
    PR差分から自動生成する使い捨てテスト。レビュー補助として活用する。
    変更が3ファイル以上あり既存テストがカバーしていない場合や、
    テストカバレッジ不足とレビュアーが判定した場合に使用する。
    永続テストの代替ではなくレビュー精度の補助ツール。
  description: >
    PR差分から自動生成する使い捨てテスト。
    レビュー補助として活用し、通常は標準JiTテスト、
    より高い検出精度が必要な場合はミューテーション誘導生成を使用する。

  procedures:
    - id: 1
      name: 標準JiTテスト手順
      conditions:
        - "変更が3ファイル以上 かつ 既存テストが変更箇所をカバーしていない"
        - "レビュアーが『テストカバレッジ不足』と判定した場合"
      steps:
        - "git diff から変更された関数・メソッドを特定する"
        - "境界値・異常系テストを生成する（使い捨て前提）"
        - "テスト実行 → 失敗があれば実装者にフィードバックする"
        - "レビュー通過後、使い捨てテストは削除可能（永続テストは別途作成）"

    - id: 2
      name: ミューテーション誘導テスト生成（arXiv:2501.12862、arXiv:2503.08182）
      conditions:
        - "標準JiTテストが全て通過するがレビュアーがエッジケースを懸念する場合"
        - "変更コードに複雑な分岐ロジックがある場合"
        - "セキュリティに敏感な変更で完全性が重要な場合"
      steps:
        - "変更コードからミュータントを生成する（単純なミューテーション: 条件の否定・演算子の入れ替え・文の削除）"
        - "各サバイバントミュータント（既存テストで検出されないもの）に対してターゲットテストを生成する"
        - "ターゲットテストを実行する → サバイバントミュータントはテスト品質のギャップを示す"
        - "実装者にレビュー用の結果をフィードバックする"

    - id: 3
      name: 使い捨てテスト管理ルール
      steps:
        - "使い捨てテストはリポジトリにコミットしない（tmp/jit-tests/ に出力）"
        - "使い捨てテストは永続テストの代替ではない。レビュー精度の補助ツール"
        - "レビュー通過後はtmp/jit-tests/ から削除する"

  templates:
    - name: ミューテーション演算子セット（軽量版）
      fields:
        - "条件の否定: if (x > 0) → if (x <= 0) — オフバイワン・境界エラー"
        - "文の削除: 1行を削除 — デッドコード・欠落したサイドエフェクト"
        - "戻り値の入れ替え: return true → return false — ロジックの反転"
        - "演算子の変更: + → -、&& → || — 算術・ロジックエラー"

  integration_points:
    - agent: kurouto-neko
      phase: レビュー時（3ファイル以上変更またはカバレッジ不足）
      action: git diffから使い捨てテストを生成し実行、失敗を実装者にフィードバック
    - agent: genba-neko
      phase: レビュー後修正時
      action: JiTテスト失敗で特定された問題を修正する
    - agent: kurouto-neko
      phase: レビュー通過後
      action: tmp/jit-tests/ から使い捨てテストを削除する（コミットしない）

  notes:
    - "使い捨てテストの出力先: tmp/jit-tests/（コミット禁止）"
    - "標準JiTテスト vs ミューテーション誘導テスト: 通常は標準を使用。複雑な分岐・セキュリティ敏感変更にはミューテーション誘導を使用"
    - "永続テストの代替にはならない。レビュー精度の補助ツール"
    - "ミューテーション誘導生成の論文根拠: arXiv:2501.12862、arXiv:2503.08182"
