module:
  name: capacity_escalation
  id: "CAPACITY-001"
  default: "OFF"
  scale: "Battalion"
  description: "Protocol for shigoto-neko to escalate when management load exceeds capacity."
  full_definition: "modules/capacity-escalation.md"
  integration_points:
    - agent: shigoto-neko
      phase: "During work (on trigger: 3+ genba-neko with delays / polling can't keep up / gates deferred / 2+ queued heartbeats)"
      action: "Send CAPACITY-001 escalation report to oyakata-neko"
    - agent: oyakata-neko
      phase: "On CAPACITY-001 from shigoto-neko"
      action: "Assess load, decide response (defer/reduce/add/shrink), issue orders"
