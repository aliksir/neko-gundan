module_detail:
  name: Faceted Prompting Module
  id: faceted_prompting
  default: "ON"
  scale: All
  why: >
    エージェントプロンプト定義は時間とともに肥大化する。
    ルール・指示・ペルソナが混在すると2つの問題が発生する:
    1. Lost in the Middle: LLMはプロンプトの先頭と末尾に最も注意を払う。中間にあるルールは忘れられる
    2. 保守負荷: 1つのルール変更に混在した文書全体の検索と更新が必要
  description: >
    関心の分離（SoC）を使ってエージェントプロンプトを構造化するための設計ガイドライン。
    TAKTのFaceted Promptingアプローチに基づく。
    エージェント定義を5つの明確なファセットに分割し、注意バイアスを活用する順序で配置する。

  procedures:
    - id: 1
      name: 5ファセット構造
      steps:
        - "ファセット1 Persona（先頭）: エージェントの正体—アイデンティティ・口調・キャッチフレーズ。注意ゾーン: 先頭（初頭効果）"
        - "ファセット2 Knowledge（中間）: 参照すべきもの—モジュール・データソース・外部情報。注意ゾーン: 中間"
        - "ファセット3 Instruction（中間）: 何をするか—手順・ワークフロー・意思決定フロー。注意ゾーン: 中間"
        - "ファセット4 Output Contract（中間→末尾）: どう出力するか—レポートフォーマット・テンプレート・スキーマ。注意ゾーン: 中間→末尾"
        - "ファセット5 Policy（末尾）: どんな制約を強制するか—ルール・禁止事項・安全。注意ゾーン: 末尾（新近効果）"

    - id: 2
      name: 新規・変更エージェント定義時の手順
      steps:
        - "新しいコンテンツがどのファセットに属するかを特定する"
        - "正しいゾーン（先頭・中間・末尾）に配置する"
        - "制約・禁止事項であれば → Policy → 末尾に配置する"
        - "複数エージェントに適用される場合 → rules/ に配置する"

    - id: 3
      name: 猫軍団エージェント定義の順序
      steps:
        - "# エージェント名"
        - "  ├── コンパクション復帰プロトコル    （Meta — 復帰ニーズ）"
        - "  ├── キャラクター・口調              （Persona — アイデンティティ優先）"
        - "  ├── 役割                            （Instruction — 何をするか）"
        - "  ├── 作業手順 / 判定フロー           （Instruction — どうやるか）"
        - "  ├── 報告フォーマット                （Output Contract — どう報告するか）"
        - "  ├── 有効モジュール                  （Knowledge — 何が使えるか）"
        - "  ├── 行動規範                        （Policy — 制約）    ← 新近効果ゾーン"
        - "  ├── 異議申し立てプロトコル          （Policy — エスカレーション）  ← 新近効果ゾーン"
        - "  └── 安全Tier（適用される場合）      （Policy — ハードリミット）   ← 新近効果ゾーン"

  integration_points:
    - agent: oyakata-neko
      phase: エージェント定義作成時
      action: 5ファセット順序（Persona → Knowledge → Instruction → Output Contract → Policy）を使って新しいエージェント定義を構造化
    - agent: shigoto-neko
      phase: エージェント定義作成時
      action: ファセット順序に従う。Policy（制約・禁止事項）を定義の末尾に配置する
    - agent: genba-neko
      phase: エージェント定義作成時
      action: ファセット順序に従う。Policy（制約・禁止事項）を定義の末尾に配置する
    - agent: kurouto-neko
      phase: レビュー時（エージェント定義変更）
      action: 新規・変更されたエージェントコンテンツが正しいファセットゾーンに配置されているか確認

  notes:
    - "LLMはU字型の注意曲線を示す: 先頭（初頭効果）・中間（Lost in the Middle・最も注意が弱い）・末尾（新近効果）"
    - "中間のCLAUDE.mdやエージェント定義に書かれたルールが無視されるのは不服従ではなく注意バイアス"
    - "猫軍団のファセットマッピング: Persona=キャラクター・口調セクション / Knowledge=有効モジュール・データソースルール / Instruction=役割・作業手順・タスク分解 / Output Contract=報告フォーマット・指示フォーマット / Policy=行動規範・安全Tier・異議申し立てプロトコル"
    - "共有Policy（DRY原則）: クロスエージェントのポリシーは各エージェントに重複させず rules/ に配置する"
    - "ルールを1か所（rules/）で変更すれば全エージェントに反映される。エージェント固有ルールはエージェントファイルのPolicyセクションに残す"
    - "'構造が注意を制御する。AIが最後に見る場所に最も重要なものを置く'"
