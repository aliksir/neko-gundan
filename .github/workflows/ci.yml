name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run framework validation
        run: python scripts/validate_framework.py .

      - name: Run tests
        run: python -m pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        # `shellcheck scripts/*.sh` fails when the glob expands to no files.
        # Guard with shopt + nullglob so an empty match yields zero args and shellcheck exits 0.
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts under scripts/; skipping shellcheck."
            exit 0
          fi
          shellcheck "${files[@]}"
        shell: bash

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS/MJS syntax
        run: |
          for f in scripts/*.mjs hooks/*.mjs hooks/*.js; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              node --check "$f"
            fi
          done
