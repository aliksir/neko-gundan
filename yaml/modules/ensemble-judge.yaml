module_detail:
  name: Ensemble Judge Module (SE-Jury Method)
  id: ensemble_judge
  default: "OFF"
  scale: Platoon+
  why: >
    重要なレビューに複数の評価戦略を組み合わせることで判定精度を高める。
    単一戦略では見落としが発生しやすく、特にセキュリティ関連レビューでは複数視点が必要。
  description: >
    重要なレビュー（Platoon+またはセキュリティ関連）に複数の評価戦略を組み合わせるSE-Jury方式。
    ルブリックスコアリング・比較判定・チェックリスト判定の3戦略を統合する。

  procedures:
    - id: 1
      name: 3戦略評価
      steps:
        - "戦略1 ルブリックスコアリング: 5観点ルブリック（正確性・安全性・保守性・テスト・目的整合性）で評価"
        - "戦略2 比較判定: 変更前後を比較して『改善されたか』を判定"
        - "戦略3 チェックリスト判定: OWASP・保守性項目を1つずつチェック"
        - "統合: 3戦略の結果を統合してAPPROVE/REQUEST_CHANGESを決定"

    - id: 2
      name: タスク別ルブリック選択（arXiv:2503.23989）
      conditions:
        - "汎用ルブリックはタスク固有の品質次元を見落とす"
        - "タスク種別に基づいてルブリックを選択する"
      steps:
        - "バグ修正: 正確性・回帰に注力。追加項目: 根本原因に対処しているか（症状だけでなく）・エッジケースがカバーされているか"
        - "新機能: 目的整合性・API設計に注力。追加項目: 後方互換性・ドキュメント更新"
        - "リファクタリング: 保守性・動作変更なしに注力。追加項目: 既存テストが通過しているか・新規依存関係なし"
        - "セキュリティ修正: 安全性・攻撃対象領域に注力。追加項目: 脆弱性が完全に修正されているか・新たな攻撃ベクタなし"
        - "タスク種別特定後、基本4観点ルブリックにタスク固有項目を追加してから評価する"

    - id: 3
      name: 動的ルブリック生成（arXiv:2602.08672）
      conditions:
        - "定義済みカテゴリに当てはまらない新規タスクの場合"
      steps:
        - "生成: タスク説明と計画から評価次元を作成する"
        - "検証: 生成した次元を基本4観点ルブリックと照合する（SafetyとCorrectnessは必須）"
        - "適用: このレビューのみに生成したルブリックを使用する"
        - "制約: セキュリティクリティカルなレビューには動的ルブリックを使用しない（事実の正確性には固定基準が必要）"

    - id: 4
      name: 多様性ベース統合（arXiv:2510.21513）
      steps:
        - "各評価戦略は同じ結論に収束するのではなく異なる評価角度を使うこと"
        - "3戦略が同一の推論を生成した場合は LOW confidence として扱う（集団思考の可能性）"
        - "利用可能な場合は異なるモデルティアを異なる戦略に割り当てる（例: SafetyにOpus、CorrectnessにSonnet）"

    - id: 5
      name: 統合判定ルール（更新版）
      steps:
        - "2戦略以上がFAIL → REQUEST_CHANGES"
        - "2戦略以上がPASSかつ推論が多様 → APPROVE"
        - "2戦略以上がPASSかつ推論が同一 → APPROVEだがレビューレポートに [LOW_DIVERSITY] フラグを付ける"
        - "1:1:1スプリット → ESCALATE（仲裁者へ）"

  integration_points:
    - agent: kurouto-neko
      phase: レビュー時（ensemble発動時）
      action: 3戦略（ルブリック・比較・チェックリスト）を全て実行して結果を統合
    - agent: shigoto-neko
      phase: レビュー前（Standard weight）
      action: 必要に応じてensembleレビューを明示的にリクエスト
    - agent: kurouto-neko
      phase: レビュー時（Strict weight）
      action: 全レビューに対してensembleを自動起動
    - agent: kurouto-neko
      phase: ensemble後（1:1:1スプリット時）
      action: 仲裁者（oyakata-neko / Opus）にエスカレーション

  notes:
    - "通常（Standard）レビューは戦略1のみ使用。Ensembleはshigoto-nekoが明示的にリクエストした場合またはStrictモード時に使用"
    - "トリガー条件: Light（常に発動しない・kurouto-nekoレビュー自体スキップ）/ Standard（shigoto-nekoが明示的にリクエスト時のみ）/ Strict（全レビューで自動起動）"
    - "コンセンサスベースの投票（多数決）は『人気の罠』に陥る可能性がある。多様性ベース統合を使用すること"
    - "セキュリティクリティカルなレビューには動的ルブリックを使用しない"
