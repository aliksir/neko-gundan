# 猫軍団 証跡モジュール設定
# 各モジュールの有効/無効を切り替えられます。
# このファイルが存在しない場合、各モジュールのデフォルト値が使われます。
#
# 使い方: false にしたモジュールの証跡出力がスキップされます。
# 成果物セット（plans/designs/test-plan/result等）には影響しません。

evidence:
  audit_trail: true      # 監査ログ（トレーサビリティ・承認記録・変更管理）
  raw_log: true          # 生ログ（全ツールコール1行1アクション記録）
  isv: true              # Intent State Vector（意図・状態・結果ベクトル）
  quality_metrics: true  # 品質メトリクス（PJ別累積レポート・傾向分析）
  checklist_export: true # チェックリスト（作業+QA項目の外部ファイル出力）
  review_output: true   # レビュー出力（simplify/kurouto-nekoの結果をファイル保存）
