module_detail:
  name: Heartbeat & Polling Module
  id: "HEARTBEAT-001 / POLLING-001"
  default: "ON"
  scale: Platoon+
  why: >
    能動的な進捗監視と詰まり検出。
    「沈黙 = 問題なし」ではなく「沈黙 = 不透明」。
    報告を待つだけでは管理していない。
    詰まっているのに黙って粘ることは美徳ではなく事故の前兆。
  description: >
    能動的な進捗監視と詰まり検出プロトコル。
    genba-neko側のHEARTBEAT-001（詰まり時報告義務）と
    shigoto-neko側のPOLLING-001（能動的進捗確認義務）の2つから構成される。
    バックグラウンドエージェントのサイレントストール検知も含む。
    分散システム原則をLLMチームに適用（arxiv:2603.12229）。

  procedures:
    - id: 1
      name: genba-neko Heartbeatプロトコル（HEARTBEAT-001）
      steps:
        - "以下のトリガーに1つでも該当したら即座にshigoto-nekoに報告する"
        - "トリガー1: 5分以上手が止まっている（調査・試行錯誤含む）"
        - "トリガー2: 同じエラーが2回発生した（3回目を試す前に報告）"
        - "トリガー3: 指示の意味がわからない（推測で進めない）"
        - "トリガー4: 想定外の状態に遭遇した（ファイルがない・APIが変わっている等）"
        - "自動エスカレーション: 同じエラーが3回連続 → Heartbeatレポートに [ESCALATION] タグを付ける。shigoto-nekoが即介入"
        - "自動エスカレーション: 10分以上進捗なし → 何が起きているかを言語化して報告する"

    - id: 2
      name: 因果障害帰属（Causal Failure Attribution、arXiv:2602.23701）
      conditions:
        - "タスク失敗または詰まりが発生した場合"
        - "L2+エスカレーション時にshigoto-nekoが実施"
      steps:
        - "タイムライン収集: 詰まったエージェントが取ったアクションを順番に列挙する"
        - "最初の逸脱を特定: 実際の挙動が期待から逸脱したのはいつか？"
        - "因果関係を逆向きに追跡する:"
        - "  - 上流エージェントの誤入力によって引き起こされたか？ → 上流エージェントの責任 → 上流修正後に下流を再実行"
        - "  - 誤った指示によって引き起こされたか？ → shigoto-nekoの責任 → 指示を修正して再割り当て"
        - "  - 環境問題（ファイルがない・API障害）によって引き起こされたか？ → エージェントの過失なし → 環境修正後にリトライ"
        - "  - エージェント自身のロジックエラーによって引き起こされたか？ → 現エージェントの責任 → 別アプローチで再挑戦"
        - "Reflexionフォーマットで記録する（因果チェーン付き）"

    - id: 3
      name: shigoto-neko ポーリングプロトコル（POLLING-001）
      steps:
        - "タスク割り当てから5分後: TaskGetで進捗を確認する"
        - "以降10分おきに: 進捗が動いているかを確認する"
        - "ESCALATIONタグ付きHeartbeatレポート受信時: 即座に介入する"
        - "進捗あり → 何もしない（静かに観察）"
        - "進捗なし → SendMessage: 「genba-neko、どうですか？状況を教えてください」"
        - "2回連続進捗なし → 直接介入: genba-nekoの作業出力をReadで直接確認 → ブロッカーを特定 → アプローチ変更・タスク再分割・別genba-nekoに再割り当て"

    - id: 4
      name: サイレンスパターン検知（shigoto-neko）
      steps:
        - "パターン1 詰まっているが聞けない: タスク開始後にメッセージがゼロ → 「大丈夫ですか？」と声をかける"
        - "パターン2 無限調査ループ: 「調査中」が続いて成果物なし → 調査スコープを絞る"
        - "パターン3 完璧主義の罠: 動くコードはあるが「まだ不完全」 → 「まず動くものを見せて」と命じる"
        - "パターン4 前提の崩壊: エラーレポートがタスクの前提と矛盾 → タスク全体を再評価"

    - id: 5
      name: バックグラウンドエージェントのサイレントストール検知（oyakata-neko）
      steps:
        - "問題: Agent(run_in_background=true)で起動したエージェントはshigoto-nekoのポーリングループをバイパスする"
        - "15分ルール: 最初のエージェント完了から15分経過しても残りが返ってこない場合、出力ファイルのタイムスタンプを確認する"
        - "ストール確認: 出力ファイルが10分以上更新されていない → ストール確定 → 部分結果を回収する"
        - "回収手順: 出力ファイルから途中結果を抽出し、未完了分はスコープを縮小して新しいエージェントで再実行する"
        - "根本原因ログ: レート制限・WebFetchの並列過多・コンテキストオーバーフローのいずれかを特定して記録する"
        - "予防策: バックグラウンドリサーチ系（WebFetch多用）は最大3体同時まで（レート制限回避）"
        - "予防策: エージェント指示にWebFetch呼び出し上限を含める（例: 「WebFetchは最大3回まで」）"
        - "予防策: 一般バックグラウンドエージェント: 最大5体同時まで"

  templates:
    - name: Heartbeatレポートフォーマット
      fields:
        - "仕事猫さん、Heartbeat報告っす！"
        - "Status: [停滞中 / 調査中 / ブロック中]"
        - "なぜ止まっているか: [具体的な状況]"
        - "試したこと: [これまでに試みたアプローチ]"
        - "必要なもの: [判断 / 情報 / 別アプローチの提案 / 何もない（報告のみ）]"

    - name: Reflexion記録フォーマット（因果チェーン付き）
      fields:
        - "Reflexion:"
        - "  What happened: [症状]"
        - "  Root cause: [実際の原因、逆追跡済み]"
        - "  Causal chain: [上流イベント] → [中間] → [観察された障害]"
        - "  Next time: [根本原因に対処した具体的な予防アクション]"

  integration_points:
    - agent: genba-neko
      phase: 作業中（ステップ6）
      action: 詰まり時に報告する（5分/2エラー/指示不明/想定外）。3回連続エラー → [ESCALATION]
    - agent: shigoto-neko
      phase: 割り当て後（進捗監視）
      action: 5分後にポーリング、以降10分おき。[ESCALATION]には即座に対応
    - agent: oyakata-neko
      phase: バックグラウンドエージェント起動後
      action: run_in_backgroundエージェントのストール検知に15分ルールを適用

  notes:
    - "「報告なし ≠ 問題なし。報告なし = 沈黙。疑うべし」"
    - "「報告を待つだけの管理者は管理していない。自分で確認しに行くこと」"
    - "「沈黙して粘ることは美徳ではない。早く言えば早く解決する」"
    - "バックグラウンドエージェントが静かにストールする方が、明確に失敗するより始末が悪い。少なくとも失敗は何かを教えてくれる"
    - "因果帰属なしに根本原因が放置されると、異なるエージェントで同じ障害が繰り返される"
